# Configuração doméstica inicial do DevMesh.
# A porta MQTT fica acessível na rede local. Não configure encaminhamento de porta
# no roteador e não exponha este broker diretamente à internet.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwordfile
acl_file /mosquitto/config/aclfile

persistence true
persistence_location /mosquitto/data/
autosave_interval 1800

log_dest stdout
log_type warning
connection_messages true
