name: MQTT smoke check

on:
  push:
    branches:
      - main
      - "test/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mqtt-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mqtt-smoke:
    name: MQTT connectivity and Meshtastic payload validation
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python for encrypted downlink builder tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: python -m pip install meshtastic==2.7.11 cryptography==44.0.2 paho-mqtt==2.1.0

      - name: Test encrypted MQTT downlink builder
        run: |
          python -m unittest discover -s tests -p 'test_mqtt_downlink_builder.py' -v
          python -m unittest discover -s tests -p 'test_mqtt_readonly_audit.py' -v

      - name: Install Protocol Buffers compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y protobuf-compiler libprotobuf-dev

      - name: Check shell syntax
        run: |
          bash -n scripts/check_mqtt_smoke.sh
          bash -n scripts/check_mqtt_auth.sh
          bash -n scripts/check_mqtt_acl.sh
          bash -n scripts/check_meshtastic_mqtt.sh
          bash -n scripts/check_meshtastic_protobuf.sh
          bash -n scripts/check_meshtastic_data_compatibility.sh
          bash -n scripts/check_meshtastic_schema_matrix.sh
          bash -n scripts/check_meshtastic_crypto_model.sh
          bash -n scripts/check_meshtastic_downlink_transport.sh
          bash -n scripts/check_home_deployment.sh

      - name: Validate and exercise the home broker deployment
        run: bash scripts/check_home_deployment.sh

      - name: Run isolated MQTT smoke check
        run: bash scripts/check_mqtt_smoke.sh

      - name: Run Meshtastic binary payload check
        run: bash scripts/check_meshtastic_mqtt.sh

      - name: Run Meshtastic MQTT downlink topic transport check
        run: bash scripts/check_meshtastic_downlink_transport.sh

      - name: Validate fixture against official Meshtastic Protobuf schemas
        run: bash scripts/check_meshtastic_protobuf.sh

      - name: Validate Meshtastic location and telemetry data schemas
        run: bash scripts/check_meshtastic_data_compatibility.sh

      - name: Check compatibility across pinned Meshtastic Protobuf versions
        run: bash scripts/check_meshtastic_schema_matrix.sh

      - name: Run Meshtastic AES-CTR channel encryption model check
        run: bash scripts/check_meshtastic_crypto_model.sh

      - name: Run isolated MQTT authentication check
        run: bash scripts/check_mqtt_auth.sh

      - name: Run isolated MQTT ACL check
        run: bash scripts/check_mqtt_acl.sh
