name: Meshtastic firmware crypto reference

on:
  push:
    branches:
      - "test/**"
      - "work/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-crypto-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-crypto-tests:
    name: Run pinned upstream crypto test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out DevMesh
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Check out pinned Meshtastic firmware source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: meshtastic/firmware
          ref: 8e6a88d06f44cad26f1e8d7cd402939ccacb9b4c
          path: firmware
          persist-credentials: false

      - name: Prepare temporary channel AES-CTR interoperability tests
        run: python scripts/prepare_firmware_crypto_interop_test.py firmware/test/test_crypto/test_main.cpp

      - name: Install native test system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libbluetooth-dev \
            libgpiod-dev \
            libyaml-cpp-dev \
            libjsoncpp-dev \
            openssl \
            libssl-dev \
            libulfius-dev \
            liborcania-dev \
            libusb-1.0-0-dev \
            libi2c-dev \
            libuv1-dev \
            libcurl4-gnutls-dev

      - name: Install pinned PlatformIO CLI
        run: python -m pip install platformio==6.1.18

      - name: Run upstream crypto tests and compare AES-CTR vectors
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/meshtastic-crypto-tests.log"
          pio test -e native -f test_crypto -vv 2>&1 | tee "$log_file"

          key="00112233445566778899aabbccddeeff"
          input_file="$RUNNER_TEMP/devmesh-crypto-plaintext.bin"
          output_file="$RUNNER_TEMP/devmesh-openssl-ciphertext.bin"
          checked=0

          while IFS='|' read -r case_id from_node packet_id plaintext; do
            [[ -n "$case_id" ]] || continue
            actual="$(grep -Eo "DEVMESH_CHANNEL_CTR_${case_id}_HEX=[0-9a-f]+" "$log_file" | tail -n 1 | cut -d= -f2 || true)"
            [[ "$actual" =~ ^[0-9a-f]+$ ]] || {
              printf 'FALHA: o firmware não emitiu ciphertext para o caso %s.\n' "$case_id" >&2
              exit 1
            }

            nonce="$(python3 - "$packet_id" "$from_node" <<'PY'
          import struct
          import sys

          packet_id = int(sys.argv[1])
          from_node = int(sys.argv[2])
          print(struct.pack("<QII", packet_id, from_node, 0).hex())
          PY
          )"
            printf '%s' "$plaintext" > "$input_file"
            openssl enc -aes-128-ctr -K "$key" -iv "$nonce" \
              -in "$input_file" -out "$output_file"
            expected="$(od -An -v -tx1 "$output_file" | tr -d '[:space:]')"

            [[ "$actual" == "$expected" ]] || {
              printf 'FALHA: ciphertext divergente no caso %s.\n' "$case_id" >&2
              printf 'Firmware: %s\nOpenSSL:  %s\n' "$actual" "$expected" >&2
              exit 1
            }
            printf 'OK: caso AES-CTR %s comparado byte a byte.\n' "$case_id"
            checked=$((checked + 1))
          done <<'CASES'
          1|591751049|305419896|A
          2|591751049|305419897|DevMesh private
          3|270544960|168496141|0123456789ABCDEF
          4|3735928559|16909060|payload-17-bytes!
          5|305419896|2271560481|Longer synthetic Meshtastic payload for boundary testing.
          CASES

          [[ "$checked" -eq 5 ]] || {
            printf 'FALHA: esperados 5 casos AES-CTR, executados %s.\n' "$checked" >&2
            exit 1
          }
          printf 'OK: cinco ciphertexts do CryptoEngine coincidem com OpenSSL.\n'

      - name: Install Protobuf compiler for integrated payload check
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y protobuf-compiler

      - name: Validate firmware ciphertext through Protobuf and MQTT
        run: bash scripts/check_firmware_crypto_protobuf_mqtt.sh "$RUNNER_TEMP/meshtastic-crypto-tests.log"
