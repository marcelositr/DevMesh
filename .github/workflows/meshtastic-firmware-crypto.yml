name: Meshtastic firmware crypto reference

on:
  push:
    branches:
      - "test/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-crypto-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-crypto-tests:
    name: Run pinned upstream crypto test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out DevMesh
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Check out pinned Meshtastic firmware source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: meshtastic/firmware
          ref: 8e6a88d06f44cad26f1e8d7cd402939ccacb9b4c
          path: firmware
          persist-credentials: false

      - name: Prepare temporary channel AES-CTR interoperability test
        run: python scripts/prepare_firmware_crypto_interop_test.py firmware/test/test_crypto/test_main.cpp

      - name: Install native test system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libbluetooth-dev \
            libgpiod-dev \
            libyaml-cpp-dev \
            libjsoncpp-dev \
            openssl \
            libssl-dev \
            libulfius-dev \
            liborcania-dev \
            libusb-1.0-0-dev \
            libi2c-dev \
            libuv1-dev \
            libcurl4-gnutls-dev

      - name: Install pinned PlatformIO CLI
        run: python -m pip install platformio==6.1.18

      - name: Run upstream crypto tests and compare channel AES-CTR output
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/meshtastic-crypto-tests.log"
          pio test -e native -f test_crypto -vv 2>&1 | tee "$log_file"

          actual="$(grep -Eo 'DEVMESH_CHANNEL_CTR_HEX=[0-9a-f]+' "$log_file" | tail -n 1 | cut -d= -f2 || true)"
          [[ "$actual" =~ ^[0-9a-f]+$ ]] || {
            printf 'FALHA: o teste do firmware não emitiu o ciphertext de referência.\n' >&2
            exit 1
          }

          key="00112233445566778899aabbccddeeff"
          nonce="78563412000000008967452300000000"
          input_file="$RUNNER_TEMP/devmesh-crypto-plaintext.bin"
          output_file="$RUNNER_TEMP/devmesh-openssl-ciphertext.bin"
          printf 'DevMesh private' > "$input_file"
          openssl enc -aes-128-ctr -K "$key" -iv "$nonce" \
            -in "$input_file" -out "$output_file"
          expected="$(od -An -v -tx1 "$output_file" | tr -d ' \n')"

          [[ "$actual" == "$expected" ]] || {
            printf 'FALHA: o ciphertext do CryptoEngine difere do modelo OpenSSL.\n' >&2
            printf 'Firmware: %s\nOpenSSL:  %s\n' "$actual" "$expected" >&2
            exit 1
          }
          printf 'OK: CryptoEngine do firmware e modelo OpenSSL produziram o mesmo ciphertext AES-CTR.\n'
